name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
            echo "Tag must start with a letter or number and contain only letters, numbers, dots, underscores, or hyphens." >&2
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress -Drevision="$VERSION" clean verify
          cp "target/signcolors-${VERSION}.jar" SignColors.jar

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" SignColors.jar --clobber
          else
            gh release create "$VERSION" SignColors.jar --verify-tag --generate-notes
          fi
