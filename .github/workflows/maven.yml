name: Maven CI

on:
  push:
    paths:
      - 'config/**'
      - 'src/**'
      - 'pom.xml'
  pull_request:
    paths:
      - 'config/**'
      - 'src/**'
      - 'pom.xml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
